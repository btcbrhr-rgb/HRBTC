<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ใบตั้งเบิกค่าแรง - {{invoiceNo}}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&family=Inter:wght@400;700;900&display=swap"
        rel="stylesheet">
    <style>
        html,
        body {
            background: white !important;
            margin: 0;
            padding: 0;
        }

        * {
            font-family: 'Sarabun', 'Noto Sans Thai', sans-serif !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            #print-btn {
                display: none !important;
            }

            /* 🔧 ลบ padding ของ container ตอนพิมพ์ เพื่อให้เนื้อหากว้างเต็มพื้นที่ A4 (190mm)
               และตรงกับขนาดที่ใช้ตอนวัดความสูง (#measure-box) */
            .print-container {
                max-width: none !important;
                padding: 0 !important;
            }

            /* 🔧 บังคับขึ้นหน้าใหม่หลังแต่ละหน้าของเอกสาร (เดิมมี class แต่ไม่มี CSS → ไม่แบ่งหน้า) */
            .page-break {
                page-break-after: always;
                break-after: page;
            }

            /* 🔧 กันแถว/กล่องลายเซ็นถูกตัดกลางระหว่างหน้า */
            tr,
            .sig-box,
            .signature-grid,
            .signature-grid-2,
            .signature-grid-4,
            .grand-total-row,
            .summary-row {
                break-inside: avoid;
                page-break-inside: avoid;
            }
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>
    <style>
        :root {
            --primary-blue: #1e40af;
        }

        /* Invoice Specific Layout Overrides */
        @media print {
            @page {
                size: A4 portrait;
                margin: 15mm 10mm;
            }
        }

        .print-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
        }

        body {
            background: white;
        }

        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-bottom-line {
            border-bottom: 4px solid #1e40af;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            margin-top: 0.5rem;
        }

        .doc-title h1 {
            margin: 0;
            font-size: 26px;
            color: var(--primary-blue);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .project-badge {
            display: inline-flex;
            align-items: center;
            background: #dbeafe;
            color: var(--primary-blue);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
        }

        .doc-info {
            text-align: right;
            font-size: 12px;
            color: #64748b;
        }

        .doc-info p {
            margin: 2px 0;
        }

        .doc-info b {
            color: #334155;
        }

        /* Table Style */
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 0 0 1.5rem 0;
            /* 🔧 fixed layout + ความกว้าง % → ตารางกระจายเต็มความกว้างกระดาษเสมอ ไม่มีช่องว่างเหลือ */
            table-layout: fixed;
            border: 1.5px solid #cbd5e1;
        }

        th,
        td {
            border: 1px solid var(--border-color);
            padding: 8px 4px;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            /* ป้องกันการล้นไปทับช่องข้างๆ */
            text-overflow: clip;
            /* ตัดจบที่ขอบโดยไม่มีจุดไข่ปลา (...) */
        }

        th {
            background-color: var(--bg-gray);
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            font-size: 11px;
        }

        /* กำหนดความกว้างเป็น % ให้รวมกัน = 100% → ตารางเต็มพื้นที่ A4 (เนื้อหา 186mm)
           — เดิมใช้ auto layout + ช่องชื่อเป็น auto → พื้นที่ว่างทั้งหมดไหลไปที่ช่องชื่อ
           (กว้าง 190px จาก 718px) ส่วนช่องเงินถูกบีบ → ดูใช้พื้นที่ไม่คุ้ม */
        .col-id {
            width: 2.5%;
            text-align: center;
        }

        .col-name {
            width: 17%;
            text-align: left;
            /* ชื่อยาวอนุญาตให้ขึ้นบรรทัดใหม่ (ไม่ตัดทิ้ง) */
            white-space: normal;
        }

        .col-qty {
            width: 5%;
            text-align: center;
        }

        .col-money {
            width: 9%;
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
            /* ตัวเลขบัญชีใช้ฟอนต์เล็กกว่าเล็กน้อย กันข้อความล้นช่อง */
            font-size: 10px;
        }

        .col-total {
            width: 11.5%;
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            background-color: #eff6ff;
            font-size: 10px;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }

        .summary-row {
            background-color: #f8fafc !important;
            font-weight: 700;
        }

        .grand-total-row {
            background-color: var(--primary-blue) !important;
            color: white !important;
            font-size: 13px;
        }

        /* Signatures — ให้สูง/โปร่งขึ้น ใช้พื้นที่ด้านล่างของหน้าให้เต็มขึ้น */
        .signature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 40px;
        }

        .signature-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 32px;
            max-width: 560px;
            margin: 36px auto 0;
        }

        .signature-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 36px;
        }

        .signature-grid-4 .sig-box {
            padding: 22px 8px;
        }

        .signature-grid-4 .sig-line {
            width: 85%;
            margin: 45px auto 10px;
        }

        .signature-grid-4 .sig-label {
            font-size: 11.5px;
        }

        .sig-box {
            border: 1px solid #f1f5f9;
            padding: 26px 12px;
            text-align: center;
            border-radius: 6px;
        }

        .sig-line {
            border-bottom: 1px dashed #cbd5e1;
            width: 80%;
            margin: 50px auto 10px;
        }

        .sig-label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
        }

        .sig-sub {
            font-size: 10px;
            color: #94a3b8;
            font-style: italic;
        }

        /* ตารางสรุปย่อ (หน้าสรุปของแต่ละโครงการ) — ตัวแน่นขึ้นเพื่อให้ 1 หน้าเก็บรายพนักงานได้เยอะ */
        .summary-compact th,
        .summary-compact td {
            padding: 5px 4px;
            font-size: 10px;
        }

        /* ตัวคั่นบอก "ขึ้นหน้าใหม่" ระหว่างโครงการ — แสดงบนจอเท่านั้น (ตอนพิมพ์ตัดหน้าใหม่จริงโดยไม่แสดง) */
        .project-page-divider {
            margin: 28px 0 18px;
            padding: 12px 16px;
            border: 2px dashed #93c5fd;
            background: #eff6ff;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: #1e40af;
        }

        @media print {
            .project-page-divider {
                display: none !important;
            }
        }

        #measure-box {
            position: absolute;
            left: -9999px;
            top: 0;
            /* 🔧 190mm = ความกว้างเนื้อหาที่พิมพ์ได้จริงบน A4 (210mm - ขอบซ้าย/ขวา 10mm) @96dpi ≈ 718px
               เดิมใช้ 800px กว้างเกินกระดาษจริง → วัดความสูงได้น้อยกว่าที่พิมพ์จริง → ข้อความล้นหน้า */
            width: 190mm;
        }
    </style>
</head>

<body>
    <div id="measure-box"></div>

    <div id="main-content" class="print-container">
        <div id="loading-state" class="text-center py-20">
            <div
                class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent mb-4">
            </div>
            <p class="text-slate-500 font-medium">กำลังประมวลผลข้อมูลเอกสาร...</p>
        </div>
        <div id="table-wrapper"></div>
    </div>

    <script id="labor-data-json" type="application/json">
        {{laborDataStr}}
    </script>

    <script id="doc-metadata-json" type="application/json">
        {{metaDataStr}}
    </script>

    <script>
        // ข้อมูลตัวอย่างสำหรับแสดงภาพกรณีเรียกดูไฟล์โดยตรง (Mock Data)
        const mockLaborData = [
            { id: "EMP001", name: "นายสมชาย ใจดี", projectName: "โครงการตัวอย่าง A", workDays: 15, specialDays: 2, otHours: 10.5, base: 15000, specialBonus: 1000, ot: 1500, meal: 500, travel: 300, other: 0 },
            { id: "EMP002", name: "นางสาวสมหญิง รักงาน", projectName: "โครงการตัวอย่าง A", workDays: 15, specialDays: 0, otHours: 5, base: 12000, specialBonus: 0, ot: 800, meal: 500, travel: 300, other: 100 }
        ];

        // ═══════════════════════════════════════════════════════════════════
        // 1. ดึงข้อมูลแรงงาน + หัวเอกสาร
        //    ลำดับการอ่านข้อมูล (กันเปิดไฟล์ตรง ๆ แล้วเห็นหน้าว่าง):
        //      ① window.__PRINT_INVOICE_DATA__  (index.html ส่งผ่าน window.open)
        //      ② window.opener.__PRINT_INVOICE_DATA__ (สำรอง — ข้อมูลอยู่ที่หน้าต้นทาง)
        //      ③ {{laborDataStr}} / {{metaDataStr}} (ถ้า GAS ส่งผ่าน HtmlService template)
        //      ④ mock ตัวอย่าง (เปิดไฟล์ดูภาพเฉย ๆ)
        // ═══════════════════════════════════════════════════════════════════
        function readInjectedData() {
            try {
                if (window.__PRINT_INVOICE_DATA__ && Array.isArray(window.__PRINT_INVOICE_DATA__.laborData)) {
                    return window.__PRINT_INVOICE_DATA__;
                }
            } catch (e) {}
            try {
                if (window.opener && window.opener.__PRINT_INVOICE_DATA__ && Array.isArray(window.opener.__PRINT_INVOICE_DATA__.laborData)) {
                    return window.opener.__PRINT_INVOICE_DATA__;
                }
            } catch (e) {}
            return null;
        }

        const injected = readInjectedData();

        const rawLabor = document.getElementById('labor-data-json').textContent.trim();
        const rawMeta = document.getElementById('doc-metadata-json').textContent.trim();

        let laborData;
        let metaData;

        if (injected) {
            laborData = injected.laborData;
            metaData = injected.metaData || {};
        } else {
            const isMockLabor = rawLabor.includes('{{') || rawLabor === '[]' || rawLabor === '';
            laborData = isMockLabor ? mockLaborData : JSON.parse(rawLabor);

            const isMockMeta = rawMeta.includes('{{') || rawMeta === '' || rawMeta.includes('undefined');
            metaData = isMockMeta ? { no: 'INV-PREVIEW', date: new Date().toLocaleDateString('th-TH'), period: 'รอบบัญชีตัวอย่าง' } : JSON.parse(rawMeta);
        }

        const invoiceInfo = {
            no: metaData.no || 'INV-PREVIEW',
            date: metaData.date || new Date().toLocaleDateString('th-TH'),
            period: metaData.period || 'รอบบัญชีตัวอย่าง',
            roundNetPay: metaData.roundNetPay || 'round',
            roundSalary: metaData.roundSalary || 'round',
            roundWelfare: metaData.roundWelfare || 'round'
        };

        // อัปเดต title ให้ตรงเลขที่เอกสารจริง
        document.title = 'ใบตั้งเบิกค่าแรง - ' + invoiceInfo.no;

        function applyRounding(value, roundType = 'round') {
            const num = parseFloat(value);
            if (isNaN(num)) return 0;
            if (roundType === 'round') return Math.round(num);
            if (roundType === 'up') return Math.ceil(num);
            if (roundType === 'down') return Math.floor(num);
            return num;
        }

        function formatNum(num) {
            const roundMode = invoiceInfo.roundNetPay || 'round';
            const isWhole = roundMode !== 'none';
            const rounded = applyRounding(num, roundMode);
            return (rounded || 0).toLocaleString('th-TH', {
                minimumFractionDigits: isWhole ? 0 : 2,
                maximumFractionDigits: isWhole ? 0 : 2
            });
        }

        function createHeader(projName) {
            return `
            <div class="doc-header">
                <div class="flex items-center gap-4">
                    <picture>
                        <source type="image/webp" srcset="https://images.weserv.nl/?url=img2.pic.in.th/pic/Screenshot-2025-03-03-132721e6cc77cbcea28f01.png&w=220&output=webp 220w, https://images.weserv.nl/?url=img2.pic.in.th/pic/Screenshot-2025-03-03-132721e6cc77cbcea28f01.png&w=110&output=webp 110w" sizes="55px">
                        <img src="https://img2.pic.in.th/pic/Screenshot-2025-03-03-132721e6cc77cbcea28f01.png" loading="lazy" decoding="async" alt="Logo" style="width:55px; height:55px; object-fit:contain;">
                    </picture>
                    <div>
                        <h1 style="font-size:18px; color:#1e40af; font-weight:700; margin:0; line-height:1.1;">บริษัท บุรีรัมย์ธงชัยก่อสร้าง จำกัด</h1>
                        <p style="font-size:10px; color:#64748b; margin:4px 0 0 0; line-height:1.3;">31/2 ถ.อินจันทร์ณรงค์ ต.ในเมือง อ.เมือง จ.บุรีรัมย์ 31000<br>โทร. 044-611134, 625991, 611835 | แฟกซ์ 044-611134</p>
                    </div>
                </div>
                <div class="doc-info">
                    <p><b>เลขที่เอกสาร:</b> ${invoiceInfo.no}</p>
                    <p><b>วันที่ออก:</b> ${invoiceInfo.date}</p>
                    <p><b>รอบบัญชี:</b> ${invoiceInfo.period}</p>
                </div>
            </div>
            <div class="header-bottom-line">
                <div class="project-badge">โครงการ: ${projName}</div>
            </div>`;
        }

        function createTable(rows, pageIdx, carryOver, isLast, total, projName) {
            let html = `
            <table>
                <thead>
                    <tr>
                        <th class="col-id">#</th>
                        <th class="col-name">ชื่อพนักงาน (รหัส)</th>
                        <th class="col-qty">วันทำ</th>
                        <th class="col-qty">เพิ่มแรง</th>
                        <th class="col-qty">OT</th>
                        <th class="col-money">ค่าแรงหลัก</th>
                        <th class="col-money">เงินเพิ่มแรง</th>
                        <th class="col-money">ค่า OT</th>
                        <th class="col-money">ค่าข้าว</th>
                        <th class="col-money">ค่าเที่ยว</th>
                        <th class="col-money">เบี้ยอื่นๆ</th>
                        <th class="col-total">ยอดสุทธิ</th>
                    </tr>
                </thead>
                <tbody>`;

            if (pageIdx > 0) {
                html += `
                <tr class="summary-row italic" style="color: #92400e;">
                    <td colspan="11" class="text-right">ยอดยกมาจากหน้า ${pageIdx}</td>
                    <td class="col-total">${formatNum(carryOver)}</td>
                </tr>`;
            }

            rows.forEach((emp, i) => {
                const sum = (emp.base || 0) + (emp.specialBonus || 0) + (emp.ot || 0) + (emp.meal || 0) + (emp.travel || 0) + (emp.other || 0);
                html += `
                <tr>
                    <td class="text-center" style="color: #94a3b8;">${rows.startOffset + i + 1}</td>
                    <td>
                        <span style="font-weight: 600; color: #334155;">${emp.name}</span>
                        <span style="font-size: 9px; color: #94a3b8; margin-left: 4px;">(${emp.id})</span>
                    </td>
                    <td class="col-qty">${emp.workDays || '-'}</td>
                    <td class="col-qty" style="color: #e11d48; font-weight: 600;">${emp.specialDays || '-'}</td>
                    <td class="col-qty">${emp.otHours ? Number(emp.otHours).toFixed(1) : '-'}</td>
                    <td class="col-money">${formatNum(emp.base)}</td>
                    <td class="col-money">${formatNum(emp.specialBonus)}</td>
                    <td class="col-money">${formatNum(emp.ot)}</td>
                    <td class="col-money">${formatNum(emp.meal)}</td>
                    <td class="col-money">${formatNum(emp.travel)}</td>
                    <td class="col-money">${formatNum(emp.other)}</td>
                    <td class="col-total">${formatNum(sum)}</td>
                </tr>`;
            });

            if (!isLast) {
                html += `
                <tr class="summary-row">
                    <td colspan="11" class="text-right">รวมสะสมหน้า ${pageIdx + 1}</td>
                    <td class="col-total">${formatNum(total)}</td>
                </tr>`;
            } else {
                html += `
                <tr class="grand-total-row">
                    <td colspan="11" class="text-right" style="padding: 12px; font-size: 11px;">ยอดรวมสุทธิทั้งโครงการ (${projName})</td>
                    <td class="col-total" style="background: transparent; color: white; border-left: 1px solid #ffffff44; font-size: 14px;">${formatNum(total)}</td>
                </tr>`;
            }

            html += `</tbody></table>`;
            return html;
        }

        // ═══════════════════════════════════════════════════════════════════
        // หน้าสรุปยอดรวมของแต่ละโครงการ (หน้าแรกของชุดเอกสารของโครงการนั้น ๆ)
        // — สรุปเฉพาะยอดรวมทั้งโครงการ: จำนวนคน / ค่าแรงรวม / เบี้ยเลี้ยงรวม / ยอดรวมสุทธิ
        //   (ไม่แสดงรายชื่อพนักงาน — รายละเอียดรายบุคคลอยู่ในหน้าถัดไป)
        // ═══════════════════════════════════════════════════════════════════
        function createProjectSummarySection(projName, recs) {
            let employees = 0, wages = 0, allowances = 0;

            (recs || []).forEach(e => {
                employees++;
                wages += (e.base || 0) + (e.specialBonus || 0) + (e.ot || 0);
                allowances += (e.meal || 0) + (e.travel || 0) + (e.other || 0);
            });
            const grandTotal = wages + allowances;

            return `
            ${createHeader(projName)}
            <div style="text-align:center; margin: 4px 0 14px;">
                <div style="display:inline-block; font-size:15px; font-weight:800; color:#1e40af; border-bottom:3px solid #1e40af; padding-bottom:4px;">📊 สรุปยอดรวมค่าแรง — ${projName}</div>
            </div>
            <table class="summary-compact">
                <thead>
                    <tr>
                        <th style="width: 55%; text-align: left;">รายการ</th>
                        <th class="col-total">ยอดรวม</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;">จำนวนคนทำงานในโครงการ</td>
                        <td class="col-total">${employees} คน</td>
                    </tr>
                    <tr>
                        <td style="text-align: left;">ค่าแรงรวม (ค่าแรงหลัก + เงินเพิ่มแรง + ค่า OT)</td>
                        <td class="col-total">${formatNum(wages)} บาท</td>
                    </tr>
                    <tr>
                        <td style="text-align: left;">เบี้ยเลี้ยงรวม (ค่าข้าว + ค่าเที่ยว + เบี้ยอื่นๆ)</td>
                        <td class="col-total">${formatNum(allowances)} บาท</td>
                    </tr>
                    <tr class="grand-total-row">
                        <td style="background: transparent; color: white; text-align: left; padding: 12px; font-size: 13px;">ยอดรวมสุทธิทั้งโครงการ</td>
                        <td class="col-total" style="background: transparent; color: white; border-left: 1px solid #ffffff44; font-size: 14px;">${formatNum(grandTotal)} บาท</td>
                    </tr>
                </tbody>
            </table>
            ${createSummarySignatures()}`;
        }

        function createSummarySignatures() {
            return `
            <div class="signature-grid-4">
                <div class="sig-box">
                    <div class="sig-label">ผู้จัดทำเอกสาร</div>
                    <div class="sig-line"></div>
                    <div class="sig-sub">( แผนกบัญชี/บุคคล )</div>
                    <div style="font-size: 10px; color: #cbd5e1; margin-top: 5px;">วันที่: ....../....../......</div>
                </div>
                <div class="sig-box">
                    <div class="sig-label">ผู้ตรวจสอบ</div>
                    <div class="sig-line"></div>
                    <div class="sig-sub">( หัวหน้าโครงการ/Foreman )</div>
                    <div style="font-size: 10px; color: #cbd5e1; margin-top: 5px;">วันที่: ....../....../......</div>
                </div>
                <div class="sig-box">
                    <div class="sig-label">ผู้รับวางบิล</div>
                    <div class="sig-line"></div>
                    <div class="sig-sub">( ผู้รับวางบิล )</div>
                    <div style="font-size: 10px; color: #cbd5e1; margin-top: 5px;">วันที่: ....../....../......</div>
                </div>
                <div class="sig-box" style="background-color: #f8fafc; border: 1px solid #e2e8f0;">
                    <div class="sig-label" style="color: var(--primary-blue);">ผู้อนุมัติจ่าย</div>
                    <div class="sig-line" style="border-color: #94a3b8;"></div>
                    <div class="sig-sub">( ผู้จัดการ/เจ้าของกิจการ )</div>
                    <div style="font-size: 10px; color: #cbd5e1; margin-top: 5px;">วันที่: ....../....../......</div>
                </div>
            </div>`;
        }

        function createSignatures() {
            return `
            <div class="signature-grid-2">
                <div class="sig-box">
                    <div class="sig-label">ผู้จัดทำเอกสาร</div>
                    <div class="sig-line"></div>
                    <div class="sig-sub">( แผนกบัญชี/บุคคล )</div>
                    <div style="font-size: 10px; color: #cbd5e1; margin-top: 5px;">วันที่: ....../....../......</div>
                </div>
                <div class="sig-box">
                    <div class="sig-label">ผู้ตรวจสอบ</div>
                    <div class="sig-line"></div>
                    <div class="sig-sub">( หัวหน้าโครงการ/Foreman )</div>
                    <div style="font-size: 10px; color: #cbd5e1; margin-top: 5px;">วันที่: ....../....../......</div>
                </div>
            </div>`;
        }

        async function render() {
            const wrapper = document.getElementById('table-wrapper');
            const measure = document.getElementById('measure-box');

            if (!laborData.length) {
                wrapper.innerHTML = '<div style="text-align:center; padding: 50px; color: #94a3b8;">ไม่พบข้อมูลพนักงาน</div>';
                document.getElementById('loading-state').style.display = 'none';
                return;
            }

            // 🔧 ความสูงเนื้อหาที่พิมพ์ได้จริงบน A4 แนวตั้ง: 297mm - ขอบบน/ล่าง 15mm = 267mm ≈ 1009px @96dpi
            //    (เดิม 1020 สูงเกินพื้นที่จริง → เนื้อหาล้นลงหน้าใหม่โดยไม่ได้ตั้งใจ)
            const MAX_H = 1009;
            let fullHtml = '';
            const grouped = laborData.reduce((acc, r) => {
                const p = r.projectName || 'ไม่ระบุ';
                if (!acc[p]) acc[p] = []; acc[p].push(r); return acc;
            }, {});

            const projs = Object.keys(grouped);

            for (let pIdx = 0; pIdx < projs.length; pIdx++) {
                const name = projs[pIdx], recs = grouped[name];

                // ═══ หน้าสรุปยอดรวมของโครงการนี้ — หน้าแรกของชุดเอกสารของแต่ละโครงการ ═══
                //    (สรุปยอดรวมทั้งโครงการเท่านั้น แล้วตามด้วยรายละเอียดเต็มรายพนักงานด้านล่าง)
                //    โครงการถัดไปขึ้นหน้าใหม่: ตอนพิมพ์ใช้ page-break ตัดหน้าใหม่จริง — บนจอแสดงตัวคั่นบอก "ขึ้นหน้าใหม่"
                if (pIdx > 0) {
                    fullHtml += `<div class="project-page-divider">📄 ขึ้นหน้าใหม่ — โครงการ ${name}</div>`;
                }
                fullHtml += `<div class="page-break" style="padding: 5mm 2mm 0 2mm;">${createProjectSummarySection(name, recs)}</div>`;

                let pages = [], current = [], carry = 0;

                for (let i = 0; i < recs.length; i++) {
                    current.push(recs[i]);
                    current.startOffset = i - (current.length - 1);
                    let sum = carry;
                    current.forEach(e => sum += (e.base || 0) + (e.specialBonus || 0) + (e.ot || 0) + (e.meal || 0) + (e.travel || 0) + (e.other || 0));

                    // 📏 Measure with Header + Table + Signatures (if last row)
                    let testHtml = createHeader(name);
                    testHtml += createTable(current, pages.length, carry, (i === recs.length - 1), sum, name);
                    if (i === recs.length - 1) testHtml += createSignatures();

                    // 🔧 จำลอง padding เดียวกับ div หน้าจริง (5mm 2mm 0 2mm) เพื่อให้ความสูงที่วัด = ความสูงตอนพิมพ์เป๊ะ
                    measure.innerHTML = `<div style="padding: 5mm 2mm 0 2mm;">${testHtml}</div>`;

                    if (measure.offsetHeight > MAX_H && current.length > 1) {
                        const pop = current.pop();
                        let pSum = carry;
                        current.forEach(e => pSum += (e.base || 0) + (e.specialBonus || 0) + (e.ot || 0) + (e.meal || 0) + (e.travel || 0) + (e.other || 0));
                        pages.push({ rows: [...current], carry, total: pSum, startOffset: current.startOffset });
                        carry = pSum;
                        current = [pop];
                        current.startOffset = i;
                    }
                }
                let fSum = carry;
                current.forEach(e => fSum += (e.base || 0) + (e.specialBonus || 0) + (e.ot || 0) + (e.meal || 0) + (e.travel || 0) + (e.other || 0));
                pages.push({ rows: current, carry, total: fSum, isLast: true, startOffset: current.startOffset });

                pages.forEach((pg, idx) => {
                    const isFinal = (pIdx === projs.length - 1 && idx === pages.length - 1);
                    // ปรับ padding ให้เหมาะสมกับแนวตั้ง
                    fullHtml += `<div class="${!isFinal ? 'page-break' : ''}" style="padding: 5mm 2mm 0 2mm;">`;
                    fullHtml += createHeader(name);
                    pg.rows.startOffset = pg.startOffset;
                    fullHtml += createTable(pg.rows, idx, pg.carry, !!pg.isLast, pg.total, name);
                    if (pg.isLast) fullHtml += createSignatures();
                    fullHtml += `</div>`;
                });
            }

            wrapper.innerHTML = fullHtml;
            document.getElementById('loading-state').style.display = 'none';
            // ✅ ไม่ auto-print — แสดงปุ่มให้กดแทน
            const printBtn = document.getElementById('print-btn');
            if (printBtn) printBtn.style.display = 'flex';
        }

        if (document.fonts) document.fonts.ready.then(render); else window.onload = render;
    </script>

    <!-- ปุ่มพิมพ์ (แสดงหลังโหลดข้อมูลเสร็จ) -->
    <button id="print-btn" onclick="window.print()" style="display:none; position:fixed; bottom:30px; right:30px; z-index:9999;
               background:#1e40af; color:white; border:none; cursor:pointer; 
               padding:14px 28px; font-size:15px; font-weight:700; 
               border-radius:12px; box-shadow:0 8px 20px rgba(30,64,175,0.4);
               align-items:center; gap:10px; transition:transform 0.15s;"
        onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        🖨️ พิมพ์เอกสาร
    </button>
</body>
