<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบพิมพ์บัตรพนักงาน CR80</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { blue:'#054B99', green:'#00A651', darkBlue:'#03346B', darkGreen:'#008A43' } },
          fontFamily: { kanit: ['Kanit','sans-serif'] }
        }
      }
    };
  </script>
  <style>
    *,*::before,*::after{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
    body{font-family:'Kanit',sans-serif;}
    .cr80-card-preview{width:320px;height:507px;}
    .cr80-card-print{width:54mm;height:85.6mm;box-sizing:border-box;}

    /* Card layout helpers */
    .card-body-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      flex:1 1 0%;        /* กินพื้นที่ตรงกลางทั้งหมด */
      min-height:0;       /* ป้องกัน flex overflow */
      overflow:visible;
      padding:4px 12px 0;
    }
    .card-photo{
      flex-shrink:0;      /* ห้ามถูก compress */
      width:160px;
      height:160px;
      border-radius:9999px;
      background:#fff;
      padding:5px;
      border:4px solid #054B99;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 30px -8px rgba(5,75,153,0.35);
    }
    .card-photo img{
      width:100%;height:100%;
      object-fit:cover;
      border-radius:9999px;
    }
    .card-qr-wrap{
      flex-shrink:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:4px 0;
    }
    @media print{
      html,body{background:#fff!important;padding:0!important;margin:0!important;}
      .no-print{display:none!important;}
      body.print-mode-single .batch-print-wrapper{display:none!important;}
      body.print-mode-single .single-print-wrapper{display:flex!important;align-items:center!important;justify-content:center!important;min-height:100vh!important;}
      body.print-mode-single .cr80-card-preview{width:54mm!important;height:85.6mm!important;box-shadow:none!important;border:1px solid #cbd5e1!important;page-break-inside:avoid;}
      /* resize เดี่ยว */
      body.print-mode-single .cr80-card-preview .card-photo{width:28mm!important;height:28mm!important;}
      body.print-mode-single .cr80-card-preview .card-name{font-size:7pt!important;}
      body.print-mode-single .cr80-card-preview .card-pos{font-size:5.5pt!important;}
      body.print-mode-single .cr80-card-preview .card-id{font-size:5pt!important;padding:1px 6px!important;}
      body.print-mode-single .cr80-card-preview .card-head-title{font-size:5.5pt!important;}
      body.print-mode-single .cr80-card-preview .card-head-badge{font-size:4pt!important;}
      body.print-mode-single .cr80-card-preview .card-foot-text{font-size:3.8pt!important;}
      /* resize ทั้งหมด */
      body.print-mode-all .single-print-wrapper{display:none!important;}
      body.print-mode-all .batch-print-wrapper{display:grid!important;grid-template-columns:repeat(3,54mm)!important;gap:4mm 6mm!important;justify-content:center!important;align-content:start!important;padding:6mm 0!important;visibility:visible!important;}
      body.print-mode-all .cr80-card-print{box-shadow:none!important;border:1px dashed #94a3b8!important;page-break-inside:avoid;}
      body.print-mode-all .cr80-card-print .card-photo{width:22mm!important;height:22mm!important;}
      body.print-mode-all .cr80-card-print .card-name{font-size:6pt!important;}
      body.print-mode-all .cr80-card-print .card-pos{font-size:5pt!important;}
      body.print-mode-all .cr80-card-print .card-id{font-size:4.5pt!important;padding:0px 4px!important;}
      body.print-mode-all .cr80-card-print .card-head-title{font-size:5pt!important;}
      body.print-mode-all .cr80-card-print .card-head-badge{font-size:3.5pt!important;}
      body.print-mode-all .cr80-card-print .card-foot-text{font-size:3.5pt!important;}
      /* card-body-wrap ใน print: หยุด overflow */
      body.print-mode-single .card-body-wrap,
      body.print-mode-all    .card-body-wrap{
        overflow:hidden!important;
        min-height:0!important;
      }
      @page{size:A4 portrait;margin:8mm;}
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 flex flex-col items-center">

  <!-- LOADING OVERLAY (แสดงขณะดึงข้อมูลจาก GAS) -->
  <div id="loadingOverlay" class="no-print fixed inset-0 bg-slate-900/95 flex flex-col items-center justify-center z-[9999] transition-opacity duration-500">
    <div class="text-center">
      <!-- Spinner -->
      <div class="relative w-20 h-20 mx-auto mb-6">
        <div class="absolute inset-0 rounded-full border-4 border-brand-blue/20"></div>
        <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-brand-green animate-spin"></div>
        <div class="absolute inset-0 flex items-center justify-center">
          <i class="fa-solid fa-id-card text-brand-blue text-2xl"></i>
        </div>
      </div>
      <!-- Status Text -->
      <h2 class="text-white text-lg font-bold mb-2">กำลังโหลดข้อมูลบัตรพนักงาน</h2>
      <p id="loadingStatus" class="text-slate-400 text-sm">กำลังเชื่อมต่อฐานข้อมูล...</p>
      <!-- Progress dots -->
      <div class="flex items-center justify-center gap-1.5 mt-4">
        <div class="w-2 h-2 rounded-full bg-brand-blue animate-bounce" style="animation-delay:0ms"></div>
        <div class="w-2 h-2 rounded-full bg-brand-blue animate-bounce" style="animation-delay:150ms"></div>
        <div class="w-2 h-2 rounded-full bg-brand-blue animate-bounce" style="animation-delay:300ms"></div>
      </div>
    </div>
  </div>

  <!-- NAVBAR -->
  <header class="no-print w-full bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div id="nav-logo-wrap" class="w-10 h-10 rounded-xl bg-brand-blue flex items-center justify-center font-bold text-lg text-white shadow-md border border-brand-green overflow-hidden">
          <span id="nav-logo-text" class="text-sm font-black">B</span>
        </div>
        <div>
          <h1 id="nav-company-name" class="font-bold text-sm sm:text-base text-white leading-tight">ระบบพิมพ์บัตรพนักงาน CR80</h1>
          <p class="text-xs text-slate-400">ISO/IEC 7810 CR80 · 54 x 85.6 mm</p>
        </div>
      </div>
      <div class="flex items-center flex-wrap gap-2">
        <select id="employeeSelect" onchange="switchEmployee(this.value)"
          class="bg-slate-800 border border-slate-700 text-slate-100 text-xs sm:text-sm rounded-lg px-3 py-2 focus:ring-2 focus:ring-brand-blue outline-none cursor-pointer">
        </select>
        <button onclick="printSingleCard()"
          class="px-3.5 py-2 bg-brand-blue hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold rounded-lg shadow transition flex items-center gap-2">
          <i class="fa-solid fa-id-card"></i><span>พิมพ์บัตรประจำตัว</span>
        </button>
        <button onclick="printAllCards()"
          class="px-3.5 py-2 bg-brand-green hover:bg-emerald-600 text-white text-xs sm:text-sm font-semibold rounded-lg shadow transition flex items-center gap-2">
          <i class="fa-solid fa-print"></i><span>พิมพ์บัตรทั้งหมด (<span id="totalBadge">0</span>)</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="w-full max-w-5xl mx-auto p-4 sm:p-6 flex-1 flex flex-col items-center justify-center">
    <div class="no-print text-center mb-6 max-w-xl">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-blue/10 text-brand-blue text-xs font-semibold mb-2">
        <i class="fa-solid fa-circle-info"></i> แบบบัตร CR80 แนวตั้ง (54mm x 85.6mm)
      </div>
      <h2 class="text-xl sm:text-2xl font-bold text-slate-800">พรีวิวบัตรประจำตัวพนักงาน</h2>
      <p class="text-xs sm:text-sm text-slate-500 mt-1">เลือกพิมพ์เฉพาะบัตรใบนี้ หรือสั่งพิมพ์รวมทั้งหมดลง A4 ได้ทันที</p>
    </div>
    <div id="singleCardWrapper" class="single-print-wrapper flex justify-center items-center my-2"></div>
    <div id="batchPrintWrapper" class="batch-print-wrapper hidden"></div>
  </main>

  <!-- TOAST -->
  <div id="toast"
    class="no-print fixed bottom-5 right-5 bg-slate-900 text-white text-xs sm:text-sm px-4 py-3 rounded-xl shadow-2xl z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 border border-slate-700">
    <i id="toastIcon" class="fa-solid fa-circle-check text-brand-green"></i>
    <span id="toastMsg">แจ้งเตือน</span>
  </div>

  <script>
    /* ── 1. DATA ──
       หมายเหตุ: ห้ามใช้ "var _CARD_DATA_ =" ตรงๆ เพราะมันจะบังค่าที่ GAS inject ไว้ก่อนหน้า
       ต้องเช็คผ่าน window เท่านั้น */
    var _CARD_DATA_ = (typeof window!=='undefined'&&window._CARD_DATA_) ? window._CARD_DATA_ : null;
    var _LOADING_CONFIG_ = (typeof window!=='undefined'&&window._LOADING_CONFIG_) ? window._LOADING_CONFIG_ : null;
    var _GAS_BASE_ = (typeof window!=='undefined'&&window._GAS_BASE_) ? window._GAS_BASE_ : null;
    var COMPANY = (_CARD_DATA_ && _CARD_DATA_.company) ? _CARD_DATA_.company : {
      name:'บริษัท บุรีรัมย์ธงชัยก่อสร้าง จำกัด', logoUrl:'',
      address:'31/2 ถนนอินจันทร์ณรงค์ ต.ในเมือง อ.เมือง จ.บุรีรัมย์ 31000',
      phone:'044-611134', fax:'044-611134',
      deepLinkBase:'' /* เติมจาก GAS (_CARD_DATA_.company.deepLinkBase) — กัน QR ผิด base */
    };
    var employees = (_CARD_DATA_ && _CARD_DATA_.employees && _CARD_DATA_.employees.length > 0)
      ? _CARD_DATA_.employees
      : [];
    var activeEmpIndex = 0;
    /* แปล console error ลึกลับเป็นข้อความไทย — เช่น GAS ตอบ HTML (OAuth dialog) แทน JSON */
    window.addEventListener('error', function(ev){
      var msg = String((ev && ev.message) || '');
      if (msg.indexOf("Unexpected token '<'") !== -1 || msg.indexOf('is not valid JSON') !== -1) {
        setLoadingStatus('ขออภัย เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง — กรุณา Deploy GAS ใหม่แล้วลองอีกครั้ง');
        try { showToast('ต้อง Deploy GAS ใหม่ก่อนพิมพ์บัตร'); } catch(eT){}
      }
    });

    /* ── 2. INIT ── */
    function hideLoadingOverlay() {
      var ov = document.getElementById('loadingOverlay');
      if (ov) { ov.style.opacity = '0'; setTimeout(function(){ ov.style.display='none'; }, 500); }
    }
    function setLoadingStatus(msg) {
      var el = document.getElementById('loadingStatus');
      if (el) el.textContent = msg;
    }
    function initUI() {
      var navName = document.getElementById('nav-company-name');
      if (navName) navName.textContent = COMPANY.name;
      var logoWrap = document.getElementById('nav-logo-wrap');
      if (COMPANY.logoUrl && logoWrap) {
        logoWrap.innerHTML = '<img src="' + COMPANY.logoUrl + '" class="w-full h-full object-contain p-1" alt="Logo">';
      } else {
        var lt = document.getElementById('nav-logo-text');
        if (lt) lt.textContent = (COMPANY.name || 'B').charAt(0).toUpperCase();
      }
      if(!employees||!employees.length){renderEmptyState_();hideLoadingOverlay();return;}
      if(activeEmpIndex>=employees.length)activeEmpIndex=0;
      if(!COMPANY.deepLinkBase)COMPANY.deepLinkBase=defaultDeepLinkBase_();
      populateDropdown();
      renderActiveCard(); drawActiveQr_();
      hideLoadingOverlay();
    }
    function drawActiveQr_(){
      var emp=employees[activeEmpIndex];
      if(!emp)return;
      drawQr('qr_'+sanitizeQrId_(getId(emp))+'_preview',getLink(emp),80);
    }
    function defaultDeepLinkBase_(){
      try{if(window.location&&window.location.origin)return window.location.origin+window.location.pathname;}catch(e0){}
      return 'https://hrbtc.vercel.app/';
    }
    function renderEmptyState_(){
      var wrap=document.getElementById('singleCardWrapper');
      if(wrap)wrap.innerHTML='<div class="max-w-md mx-auto text-center bg-white rounded-2xl border border-amber-200 shadow p-8"><div class="w-14 h-14 mx-auto rounded-full bg-amber-100 flex items-center justify-center mb-3"><i class="fa-solid fa-triangle-exclamation text-amber-500 text-xl"></i></div><h3 class="font-bold text-slate-800">ไม่พบข้อมูลพนักงาน</h3><p class="text-xs text-slate-500 mt-1">รหัสที่ระบุอาจผิด หรือพนักงานลาออก/พักงานแล้ว<br>ลองกลับไปเลือกใหม่ หรือกดพิมพ์บัตรทั้งหมด</p></div>';
      var sel2=document.getElementById('employeeSelect');
      if(sel2)sel2.innerHTML='<option value="">-- ไม่มีข้อมูล --</option>';
      var badge2=document.getElementById('totalBadge');
      if(badge2)badge2.textContent='0';
    }
    function applyCardResult_(result){
      setLoadingStatus('กำลังแสดงบัตร...');
      if(result&&result.status==='success'){
        COMPANY=result.company||COMPANY;
        employees=result.employees||[];
        activeEmpIndex=0;
        initUI();
      }else{
        setLoadingStatus('ขออภัย ' + ((result&&result.message)||'ไม่พบข้อมูลพนักงาน'));
        renderEmptyState_();
        setTimeout(hideLoadingOverlay,2500);
      }
    }
    function gasActionBase_(){
      if(_GAS_BASE_){try{return String(_GAS_BASE_).split('?')[0];}catch(eGB){}}
      try{if(/script\.google/i.test(window.location.hostname||''))return window.location.origin+window.location.pathname;}catch(e9){}
      return '';
    }
    function safeJsonParse_(text){
      // GAS ถ้า error / ยังไม่ deploy / OAuth จะคืน HTML แทน JSON — ต้องดักก่อน .json() แตก
      var t = String(text || '');
      var s = t.replace(/^\s+/, '');
      if (s.charAt(0) !== '{' && s.charAt(0) !== '[') {
        var m = t.match(/<title[^>]*>([^<]*)<\/title>/i);
        var hint = m ? m[1] : t.slice(0, 120);
        throw new Error('เซิร์ฟเวอร์ตอบกลับเป็น HTML ไม่ใช่ JSON (' + String(hint).trim().slice(0,120) + ') — กรุณา Deploy GAS ใหม่');
      }
      return JSON.parse(t);
    }
    function fetchCardDataByHttp_(empIds){
      var base=gasActionBase_();
      if(!base){setLoadingStatus('ขออภัย ไม่พบข้อมูลพนักงาน (ไม่มี _CARD_DATA_)');renderEmptyState_();setTimeout(hideLoadingOverlay,2500);return;}
      setLoadingStatus('กำลังดึงข้อมูลพนักงาน...');
      fetch(base+'?action=getQrCardData'+(empIds?('&empIds='+encodeURIComponent(empIds)):''),{redirect:'follow'})
        .then(function(r){return r.text().then(function(t){return safeJsonParse_(t);});}).then(applyCardResult_)
        .catch(function(err){setLoadingStatus('ขออภัย โหลดข้อมูลล้มเหลว: '+((err&&err.message)||err));renderEmptyState_();setTimeout(hideLoadingOverlay,2500);});
    }
    /* ── 2b. BOOT ── */
    window.addEventListener('DOMContentLoaded', function() {
      // ทางหลัก: GAS inject _CARD_DATA_ มาแล้ว — แสดงทันที (เร็วสุด)
      if (_CARD_DATA_ && _CARD_DATA_.employees && _CARD_DATA_.employees.length > 0) { initUI(); return; }
      // ทางรอง: 2-Phase ผ่าน google.script.run (ถ้า GAS ส่ง _LOADING_CONFIG_ มา)
      if (_LOADING_CONFIG_ && _LOADING_CONFIG_.empIds !== undefined
          && typeof google !== 'undefined' && google.script && google.script.run) {
        setLoadingStatus('กำลังดึงข้อมูลพนักงาน...');
        try {
          google.script.run
            .withSuccessHandler(applyCardResult_)
            .withFailureHandler(function(){ fetchCardDataByHttp_(_LOADING_CONFIG_.empIds); })
            .getQrCardDataForClient(_LOADING_CONFIG_.empIds);
          return;
        } catch (e5) { /* ตกไป HTTP */ }
      }
      // ทางสุดท้าย: ไม่มี _CARD_DATA_ และไม่มี google.script — ถ้าไม่มี GAS base ด้วย = เปิดไฟล์เพียวๆ
      if (_CARD_DATA_ && _CARD_DATA_.employees) { renderEmptyState_(); hideLoadingOverlay(); return; }
      var ids2 = (_LOADING_CONFIG_ && _LOADING_CONFIG_.empIds) ? _LOADING_CONFIG_.empIds : '';
      if (!gasActionBase_()) { renderEmptyState_(); hideLoadingOverlay(); return; }
      fetchCardDataByHttp_(ids2);
    });


    /* ── 3. FIELD HELPERS ── */
    // Code.gs inject: { empId, name, position, photoUrl, qrUrl }
    // index.html (admin) inject: { รหัสพนักงาน, ชื่อ-นามสกุล, ตำแหน่ง, ... }
    function escHtml_(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function gf(emp,keys){for(var i=0;i<keys.length;i++){if(emp[keys[i]]!=null&&emp[keys[i]]!=='')return emp[keys[i]];}return '';}
    function getId(emp)    {return gf(emp,['empId','รหัสพนักงาน','emp_id','id']);}
    function getName(emp)  {return gf(emp,['name','fullName','ชื่อ-นามสกุล','employee_name']);}
    function getPos(emp)   {return gf(emp,['position','ตำแหน่ง','pos']);}
    function getPhoto(emp) {return gf(emp,['photoUrl','photo_url','photo','ลิ้งภาพโปรไฟล์','รูปถ่าย','avatar']);}
    function getLink(emp)  {
      var dl=gf(emp,['qrUrl','deepLink','deep_link','qr_url']);
      if(dl)return dl;
      var id=getId(emp);
      return id?((COMPANY.deepLinkBase||defaultDeepLinkBase_())+'?empId='+encodeURIComponent(id)+'&tab=attendance'):'';
    }

    /* ── 4. DROPDOWN ── */
    function populateDropdown(){
      var sel=document.getElementById('employeeSelect');
      var badge=document.getElementById('totalBadge');
      sel.innerHTML='';
      employees.forEach(function(emp,i){
        var o=document.createElement('option');
        o.value=i; o.textContent=getId(emp)+' — '+getName(emp);
        if(i===activeEmpIndex)o.selected=true;
        sel.appendChild(o);
      });
      if(badge)badge.textContent=employees.length;
    }
    function switchEmployee(idx){activeEmpIndex=parseInt(idx,10);renderActiveCard();}

    /* ── 5. CARD TEMPLATE ── */
    function sanitizeQrId_(s){return String(s==null?'':s).replace(/[^a-zA-Z0-9_-]/g,'_')||'noid';}
    function cardHTML(emp,cardClass,qrSuffix){
      var empId=getId(emp), empName=getName(emp), empPos=getPos(emp), empPhoto=getPhoto(emp);
      var qrId='qr_'+sanitizeQrId_(empId)+'_'+qrSuffix;
      var photoSrc=empPhoto?empPhoto:'https://placehold.co/200x200/054b99/ffffff?text='+encodeURIComponent((empName||'E').charAt(0));
      var footAddr=COMPANY.address?(COMPANY.address+'<br>โทร. '+(COMPANY.phone||'')+(COMPANY.fax?' · แฟกซ์ '+COMPANY.fax:'')):'&nbsp;';
      return [
        '<div class="'+cardClass+' bg-white rounded-2xl shadow-xl relative overflow-hidden flex flex-col justify-start text-slate-800 border border-slate-200">',
          /* header */
          '<div class="bg-brand-blue px-3 pt-3 pb-5 text-white text-center flex flex-col items-center relative shadow-sm border-t-4 border-brand-green z-10" style="flex-shrink:0;">',
            '<div class="card-head-title font-extrabold text-[12px] leading-tight uppercase tracking-tight line-clamp-2 drop-shadow-sm px-1">'+escHtml_(COMPANY.name)+'</div>',
            '<div class="card-head-badge inline-block mt-1 px-2.5 py-0.5 bg-brand-green rounded text-[9px] font-bold tracking-wider text-white uppercase shadow-sm">Attendance Pass · บัตรลงเวลา</div>',
            '<div class="absolute -bottom-3 left-0 right-0 h-4 bg-white" style="clip-path:ellipse(55% 100% at 50% 100%);"></div>',
          '</div>',
          /* photo + meta */
          '<div class="card-body-wrap">',
            '<div class="card-photo mt-2">',
              '<img src="'+String(photoSrc).replace(/"/g,'&quot;')+'" class="w-full h-full object-cover rounded-full" alt="รูปพนักงาน" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=\'https://placehold.co/200x200/054b99/ffffff?text=Photo\'">',
            '</div>',
            '<h3 class="card-name font-extrabold text-[15px] text-brand-blue leading-tight mt-1.5 text-center tracking-tight">'+escHtml_(empName)+'</h3>',
            '<div class="card-pos text-[11px] font-bold text-slate-600 mt-1 text-center">ตำแหน่ง: '+escHtml_(empPos)+'</div>',
            '<div class="card-id mt-1.5 px-3 py-0.5 bg-brand-blue text-white rounded-md font-mono font-black text-[11px] shadow-sm border border-brand-green/40">รหัส: '+escHtml_(empId)+'</div>',
          '</div>',
          /* QR */
          '<div class="card-qr-wrap">',
            '<div id="'+qrId+'" class="p-1.5 bg-white border border-emerald-300 rounded-xl shadow-md"></div>',
          '</div>',
          /* footer */
          '<div class="z-10 bg-white/80">',
            '<div class="card-foot-text px-2 pb-1.5 text-center text-[7.5px] text-slate-500 leading-tight border-t border-slate-100 pt-1">'+footAddr+'</div>',
            '<div class="h-2 w-full bg-gradient-to-r from-brand-blue via-brand-green to-brand-blue"></div>',
          '</div>',
        '</div>'
      ].join('');
    }

    /* ── 6. QR DRAW ── */
    function qrFallbackImg_(el,url,size){var s=size||80;el.innerHTML='<img src="https://api.qrserver.com/v1/create-qr-code/?size='+s+'x'+s+'&margin=4&data='+encodeURIComponent(url)+'" width="'+s+'" height="'+s+'" alt="QR" referrerpolicy="no-referrer">';}
    function drawQr(id, url, size){
      var el=document.getElementById(id);
      if(!el||!url)return;
      el.innerHTML='';
      try{
        new QRCode(el,{text:url,width:size,height:size,colorDark:'#054B99',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
      }catch(e){
        el.innerHTML='<img src="https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&margin=4&data='+encodeURIComponent(url)+'" width="'+size+'" height="'+size+'" alt="QR" referrerpolicy="no-referrer">';
      }
    }

    /* ── 7. RENDER SINGLE ── */
    function renderActiveCard(){
      var emp=employees[activeEmpIndex];
      var wrap=document.getElementById('singleCardWrapper');
      wrap.innerHTML=cardHTML(emp,'cr80-card-preview','preview');
      setTimeout(function(){drawActiveQr_();},50);
    }

    /* ── 8. PRINT SINGLE ── */
    function printSingleCard(){
      document.body.classList.remove('print-mode-all');
      document.body.classList.add('print-mode-single');
      showToast('กำลังเปิดหน้าต่างพิมพ์บัตรประจำตัว...');
      setTimeout(function(){window.print();},300);
    }

    /* ── 9. PRINT ALL ── */
    function printAllCards(){
      document.body.classList.remove('print-mode-single');
      document.body.classList.add('print-mode-all');
      var batch=document.getElementById('batchPrintWrapper');
      batch.innerHTML='';
      employees.forEach(function(emp){
        var d=document.createElement('div');
        d.innerHTML=cardHTML(emp,'cr80-card-print','batch');
        batch.appendChild(d);
      });
      setTimeout(function(){
        employees.forEach(function(emp){drawQr('qr_'+sanitizeQrId_(getId(emp))+'_batch',getLink(emp),68);});
        showToast('กำลังเปิดหน้าต่างพิมพ์บัตรทั้งหมด ('+employees.length+' ใบ)...');
        setTimeout(function(){window.print();},400);
      },80);
    }

    /* ── 10. TOAST ── */
    function showToast(msg){
      var t=document.getElementById('toast');
      document.getElementById('toastMsg').textContent=msg;
      t.classList.remove('translate-y-20','opacity-0');
      setTimeout(function(){t.classList.add('translate-y-20','opacity-0');},3000);
    }
  </script>
</body>
</html>
